[package]
name = "alda-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Local-first application service for the Alda Music Agent"

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", features = ["http1", "json", "tokio", "ws"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4.6.1", features = ["derive"] }
futures-util = "0.3"
rand = "0.9"
reqwest = { version = "0.12.28", default-features = false, features = ["json"] }
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.52.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.29"
