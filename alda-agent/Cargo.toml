[package]
name = "alda-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Local-first application service for the Alda Music Agent"

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", features = ["http1", "json", "tokio"] }
clap = { version = "4.6.1", features = ["derive"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
