<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/app.css">
  <title>Alda Agent</title>
</head>
<body>
  <main>
    <h1>Alda Agent local client</h1>
    <section>
      <label>Bootstrap code <input id="bootstrap-code" autocomplete="off"></label>
      <button id="bootstrap">Establish browser session</button>
    </section>
    <section>
      <button id="reconnect">Reconnect events</button>
      <h2>Project</h2>
      <label>Name <input id="project-name" value="My project"></label>
      <button id="project-create">Create Project</button>
      <h2>Session</h2>
      <button id="session-start">Start Session</button>
      <button id="session-snapshot">Refresh Session snapshot</button>
      <h2>Turn</h2>
      <label>Prompt <textarea id="turn-prompt">Write a short etude</textarea></label>
      <button id="turn-start">Start Turn</button>
      <button id="turn-cancel">Cancel Turn</button>
      <h2>Current IDs and status</h2>
      <pre id="identity"></pre>
    </section>
    <section>
      <h2>Question choices</h2>
      <div id="questions"></div>
      <h2>Approval details</h2>
      <pre id="approvals"></pre>
      <button id="approve" disabled>Approve</button>
      <button id="deny" disabled>Deny</button>
      <h2>Artifact occurrence</h2>
      <div id="artifact"></div>
    </section>
    <p id="status">Offline — no command has been submitted.</p>
    <pre id="output"></pre>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
